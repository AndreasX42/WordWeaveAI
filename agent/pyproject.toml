[project]
name = "vocab-agent"
version = "0.1.0"
description = "WordWeave vocabulary processing LangGraph agent"
requires-python = ">=3.13"

[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 80
known_first_party = ["vocab_processor", "handlers", "tests"]
